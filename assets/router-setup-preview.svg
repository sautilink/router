      <rect x="162" width="164" height="48" rx="14" fill="#fff" stroke="#dbe3ef"/>
      <circle cx="186" cy="24" r="8" fill="#dcf7ed"/><circle cx="186" cy="24" r="3" fill="#0f9f6e"/>
