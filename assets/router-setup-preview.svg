<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SautiLink Router Setup Gateway</title>
  <desc id="desc">A professional blue and white preview showing a guided router recommendation.</desc>
  <defs>
