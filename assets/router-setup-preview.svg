      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 90) rotate(125) scale(430)">
      <stop stop-color="#60a5fa" stop-opacity=".38"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#cbd5e1" stroke-opacity=".38"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
