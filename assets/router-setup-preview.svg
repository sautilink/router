    <text x="0" y="154" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="800" letter-spacing="-2.5">your Wi-Fi settings.</text>
    <text x="0" y="204" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="20">Private guidance for router brands and providers worldwide.</text>
