name: SautiLink Brand Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify brand system, router catalog, SEO and PWA cache
        shell: python
        run: |
          from pathlib import Path
          import json
          required=["SautiLink Router Logo.png","SautiLink Router Logo.jpg.jpeg","assets/fonts/inter/InterVariable.woff2","assets/fonts/inter/InterVariable-Italic.woff2","assets/fonts/inter/OFL.txt","assets/brand/system.css","assets/app.css","assets/app.js","assets/router-catalog.json","assets/router-setup-preview.png","assets/icons/router-logo.png","assets/icons/router-icon-192.png","assets/icons/router-icon-512.png","assets/icons/router-icon-maskable-512.png","assets/icons/apple-touch-icon.png","assets/icons/favicon.ico","robots.txt","sitemap.xml","llms.txt","src/index.js"]
          for item in required:
              p=Path(item); assert p.exists() and p.stat().st_size>0, f"missing/empty brand asset: {item}"
          assert not Path("assets/fonts/lora").exists()
          assert not Path("assets/fonts/zalando-sans-semiexpanded").exists()
          css=Path("assets/brand/system.css").read_text(encoding="utf-8")
          lowered_css=css.lower()
          for token in ["#2563eb","#60a5fa","#ffffff",'"inter"',"100 900"]: assert token in lowered_css, f"missing token {token}"
          assert "lora" not in lowered_css and "zalando" not in lowered_css and "--font-brand" not in lowered_css
          assert "http://" not in css and "https://" not in css
          html=Path("index.html").read_text(encoding="utf-8")
          assert "/assets/brand/system.css" in html
          assert "/assets/fonts/inter/InterVariable.woff2" in html
          lowered=html.lower()
          for legacy in ["fonts.googleapis.com","fonts.gstatic.com","bricolage grotesque","lora-variable","zalando","#e11b1b"]:
              assert legacy not in lowered, f"legacy brand token remains: {legacy}"
          manifest=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("theme_color","").lower()=="#2563eb"
          assert manifest.get("name")=="SautiLink Router"
          manifest_icons=manifest.get("icons",[])
          assert len(manifest_icons)>=3
          assert all(icon.get("src","").startswith("/assets/icons/") for icon in manifest_icons)
          assert any(icon.get("purpose")=="maskable" for icon in manifest_icons)
          catalog=json.loads(Path("assets/router-catalog.json").read_text(encoding="utf-8"))
          assert len(catalog.get("countryCodes",[])) >= 249
          assert len(catalog.get("providers",[])) >= 250
          assert len(catalog.get("brands",[])) >= 50
          assert len(catalog.get("gateways",[])) >= 20
          assert "https://router.sautilink.com/" in Path("sitemap.xml").read_text(encoding="utf-8")
          robots=Path("robots.txt").read_text(encoding="utf-8")
          assert "OAI-SearchBot" in robots and "Sitemap:" in robots
          sw=Path("sw.js").read_text(encoding="utf-8")
          assert "sautilink-router-v5" in sw
          for item in ["/assets/brand/system.css","/assets/app.css","/assets/app.js","/assets/router-catalog.json","/assets/icons/router-logo.png","/assets/icons/router-icon-192.png","/assets/icons/router-icon-512.png","/assets/icons/router-icon-maskable-512.png","/assets/icons/apple-touch-icon.png","/assets/icons/favicon.ico","/assets/fonts/inter/InterVariable.woff2","/assets/fonts/inter/InterVariable-Italic.woff2"]:
              assert item in sw, f"PWA cache missing {item}"
